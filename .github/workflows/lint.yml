name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-md:
    runs-on: ubuntu-24.04
    name: Lint Markdown content
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Markdown lint for README
        uses: docker://avtodev/markdown-lint:v1
        with:
          config: ./.markdownlint.json
          args: ./README.md

  lint-editorconfig:
    runs-on: ubuntu-24.04
    name: Lint for editorconfig violations
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Check for editorconfig violations
        uses: editorconfig-checker/action-editorconfig-checker@v2

  lint-markdown-toc:
    runs-on: ubuntu-24.04
    name: Lint for Table of Contents
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Download mktoc
        run: |
          wget https://github.com/KevinGimbel/mktoc/releases/download/v5.1.1/mktoc-x86_64-unknown-linux-gnu.tar.gz
          tar -zxvf mktoc-x86_64-unknown-linux-gnu.tar.gz
      - run: ./mktoc README.md
      - run: git diff --exit-code

  lint-index:
    runs-on: ubuntu-24.04
    name: Lint for stale generated index
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # `extract` also enforces the accounting gate: every "* " bullet outside
      # the TOC must be exactly one entry or one label, or it exits non-zero.
      - name: Regenerate the index from README.md
        run: cargo run --bin index -- extract
      - name: Rebuild nodes, edges and categories
        run: cargo run --bin index -- graph
      # Only the README-derived artifacts are rebuilt here. The crates.io ones
      # need a 1.8GB dump, so they are refreshed deliberately, not in CI.
      # Expected to fail after a README change (e.g. an upstream merge).
      # The fix is: run `cargo run --bin index` and commit the index/ diff.
      - name: Fail if the committed index is stale
        run: git diff --exit-code -- index/
