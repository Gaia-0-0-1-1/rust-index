name: Automatic Approve
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
jobs:
  automatic-approve:
    # Upstream-only: this is rust-unofficial's maintenance automation and
    # needs their API secrets. A fork runs the gates in lint.yml instead.
    if: github.repository == 'rust-unofficial/awesome-rust'
    name: Automatic Approve
    runs-on: ubuntu-24.04
    steps:
      - name: Automatic Approve
        uses: mheap/automatic-approve-action@v1.1.0
        with:
          token: ${{ secrets.TOKEN_FOR_GITHUB }}
          workflows: "rust.yml,lint.yml"
          dangerous_files: src/main.rs,Cargo.toml,Cargo.lock
