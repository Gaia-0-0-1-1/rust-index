name: PR tidyup
on:
  push:
  pull_request_target:
    types: [opened, reopened, synchronize]
jobs:
  pr_tidyup:
    # Upstream-only: this is rust-unofficial's maintenance automation and
    # needs their API secrets. A fork runs the gates in lint.yml instead.
    if: github.repository == 'rust-unofficial/awesome-rust'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Run
        run: cargo run --bin pr_tidyup
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_FOR_GITHUB }}
